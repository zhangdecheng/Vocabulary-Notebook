var MIN=60000,DAY=86400000;
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function dayEnd(){var d=new Date();d.setHours(23,59,59,999);return d.getTime()}
function ids(){return Object.keys(W).map(Number).sort(function(a,b){return a-b})}
function inFilter(i){var w=W[i],c=S.cfg;if(c.theme&&w.t.indexOf(c.theme)<0)return false;if(c.star&&!w.s)return false;if(c.nw&&!w.new)return false;if(c.bt&&w.bt!==c.bt)return false;return true}
function cids(){var out=[],c=S.cfg;ids().forEach(function(i){if(!inFilter(i))return;if(c.dir==='en'||c.dir==='both')out.push(String(i));if(c.dir==='zh'||c.dir==='both')out.push('r'+i)});return out}
function wid(cid){return Number(String(cid).replace('r',''))}
function newDone(){return S.day[today()]||0}
function buildQueue(){
  var now=Date.now(),end=dayEnd(),learn=[],rev=[],nw=[];
  cids().forEach(function(cid){var c=S.cards[cid];
    if(!c){nw.push(cid);return}
    if(c.q==='l'){if(c.due<=end)learn.push(cid)}else if(c.due<=end)rev.push(cid)});
  if(S.cfg.order==='random'){nw.sort(function(){return Math.random()-.5})}
  else nw.sort(function(a,b){var A=W[wid(a)],B=W[wid(b)];/*bt-anki*/var bA=A.bt?1:0,bB=B.bt?1:0;if(bA!==bB)return bB-bA;if(bA&&bB&&A.lk!==B.lk)return (B.lk||0)-(A.lk||0);return (A.h-B.h)||(wid(a)-wid(b))||(a<b?-1:1)});
  var left=Math.max(0,S.cfg.newPerDay-newDone());
  learn.sort(function(a,b){return S.cards[a].due-S.cards[b].due});rev.sort(function(a,b){return S.cards[a].due-S.cards[b].due});
  return {learn:learn,rev:rev,nw:nw.slice(0,left),nwAll:nw.length}
}
function pick(){var Q=buildQueue(),now=Date.now();
  var l=Q.learn.filter(function(c){return S.cards[c].due<=now});
  if(l.length)return l[0];if(Q.rev.length)return Q.rev[0];if(Q.nw.length)return Q.nw[0];if(Q.learn.length)return Q.learn[0];return null}
// SM-2 with learning steps
var STEPS=[1,10];// minutes
function schedule(cid,g,peek){
  var c=S.cards[cid]?JSON.parse(JSON.stringify(S.cards[cid])):{q:'n',ef:2.5,iv:0,reps:0,lap:0,st:0},now=Date.now();
  if(c.q==='n'||c.q==='l'){
    c.q='l';
    if(g===1){c.st=0;c.due=now+STEPS[0]*MIN}
    else if(g===2){c.due=now+Math.round((STEPS[0]+STEPS[1])/2*MIN)}
    else if(g===3){c.st++;if(c.st>=STEPS.length){c.q='r';c.iv=c.rl?Math.max(1,c.iv):1;c.due=now+c.iv*DAY;c.reps++;delete c.rl}else c.due=now+STEPS[c.st]*MIN}
    else{c.q='r';c.iv=c.rl?Math.max(2,c.iv):4;c.ef=Math.min(3.5,c.ef+0.15);c.due=now+c.iv*DAY;c.reps++;delete c.rl}
  }else{
    var od=Math.max(0,(now-c.due)/DAY);
    if(g===1){c.lap++;c.ef=Math.max(1.3,c.ef-0.2);c.iv=Math.max(1,Math.round(c.iv*0.5));c.q='l';c.st=0;c.rl=1;c.due=now+10*MIN}
    else if(g===2){c.ef=Math.max(1.3,c.ef-0.15);c.iv=Math.max(c.iv+1,Math.round(c.iv*1.2));c.due=now+c.iv*DAY;c.reps++}
    else if(g===3){c.iv=Math.max(c.iv+1,Math.round((c.iv+od/2)*c.ef));c.due=now+c.iv*DAY;c.reps++}
    else{c.ef=Math.min(3.5,c.ef+0.15);c.iv=Math.max(c.iv+2,Math.round((c.iv+od)*c.ef*1.3));c.due=now+c.iv*DAY;c.reps++}
  }
  return c}
function ivl(c){var d=c.due-Date.now();if(d<3600000)return Math.max(1,Math.round(d/MIN))+' 分钟';if(d<DAY)return Math.round(d/3600000)+' 小时';var x=Math.round(d/DAY);return x<31?x+' 天':(x<365?(x/30).toFixed(1)+' 个月':(x/365).toFixed(1)+' 年')}
// audio
var A=new Audio(),urlC={},ACC=S.cfg.acc;
function url(acc,k){var key=acc+'-'+k;if(urlC[key])return urlC[key];var el=document.getElementById('a-'+key);
  if(el){var b=atob(el.textContent.trim()),n=b.length,u=new Uint8Array(n);for(var x=0;x<n;x++)u[x]=b.charCodeAt(x);return urlC[key]=URL.createObjectURL(new Blob([u],{type:'audio/mpeg'}))}

function metaH(w,cid){var c=S.cards[cid];return '<div class="meta"><span class="tag">'+esc(w.t[0])+'</span>'+(w.s?'<span class="st">★ 高频</span>':'')+(w.new?'<span class="nw">NEW</span>':'')+(w.bt?'<span class="nw bt">新 '+esc(w.bt)+' · 课堂 '+esc((w.d||[]).slice(-1)[0]||'')+'</span>':'')+'<span>'+(String(cid).charAt(0)==='r'?'中 → 英':'英 → 中')+'</span><span>'+(c?(c.q==='l'?'学习中':'复习 · 间隔 '+c.iv+' 天'):'新卡')+'</span></div>'}
function render(){

  if(!cur){var Q=buildQueue(),fl=S.cfg.theme||S.cfg.star||S.cfg.nw||S.cfg.bt;el.innerHTML='<div class="done"><div class="big">'+(cids().length?'🎉':'🔍')+'</div><h2>'+(cids().length?'今天的卡片都完成了':'当前筛选下没有卡片')+'</h2><p>'+(Q.nwAll?'还有 '+Q.nwAll+' 张新卡未学。':(cids().length?'当前筛选下所有卡片都学过了。':''))+'</p><div class="row" style="justify-content:center">'+(Q.nwAll?'<button class="btn pri" id="more">再学 20 张新卡</button>':'')+(fl?'<button class="btn" id="clr">清除筛选（全部 '+Object.keys(W).length+' 词）</button>':'')+'</div></div>';return}
  var i=wid(cur),w=W[i],rev=String(cur).charAt(0)==='r',f;

  else{f='<div class="zh">'+esc(w.z)+'</div>'+(S.cfg.cloze&&clozeSent(w)?'<div class="cz">'+clozeSent(w)+'</div><div class="hint">用英文说出挖空处 · 第 '+w.sh+' 章</div>':'<div class="hint">用英文怎么说？</div>')}
  el.innerHTML=metaH(w,cur)+'<div class="front">'+f+'</div><div id="back"></div><button class="show" id="showB">显示答案 <small>(空格)</small></button>';

function showAns(){if(!cur||shown)return;shown=true;var i=wid(cur),w=W[i];

function grade(g){if(!cur||!shown)return;var prev=S.cards[cur]?JSON.parse(JSON.stringify(S.cards[cur])):null,wasNew=!prev;
  S.cards[cur]=schedule(cur,g);if(wasNew)S.day[today()]=newDone()+1;

function doUndo(){if(!undo)return toast('没有可撤销的操作');if(undo.prev)S.cards[undo.cid]=undo.prev;else delete S.cards[undo.cid];if(undo.wasNew)S.day[today()]=Math.max(0,newDone()-1);S.log.pop();undo=null;sv();render();stats();toast('已撤销')}
